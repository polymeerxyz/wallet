services:
  fiber:
    build:
      context: .
      args:
        FIBER_VERSION: ${FIBER_VERSION:-v0.8.1}
    environment:
      FIBER_NETWORK: ${FIBER_NETWORK:?FIBER_NETWORK is required (testnet or mainnet)}
    env_file:
      - path: ${FIBER_NETWORK}.env
        required: true
    command: ["sh", "-c", "exec ./fnn -c ./$${FIBER_NETWORK}.yml -d ."]
    volumes:
      - ./ckb/key:/fiber/ckb/key
      - ./${FIBER_NETWORK}/fiber.yml:/fiber/${FIBER_NETWORK}.yml:ro
    ports:
      - "8228:8228"
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./${FIBER_NETWORK}/nginx.conf:/etc/nginx/conf.d/fiber.conf:ro
    depends_on:
      - fiber
    restart: unless-stopped
